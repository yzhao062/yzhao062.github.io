name: Site Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  site-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history: prerender_pages.py derives sitemap lastmod values from
          # per-file git dates, which a shallow clone cannot supply.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Regenerate prerendered pages
        run: python scripts/prerender_pages.py

      - name: Verify committed prerendered HTML matches the JSON sources
        run: git diff --exit-code -- publications.html lab.html index.html

      # sitemap.xml is excluded from the check above on purpose. refresh_sitemap
      # sets each lastmod from that page's git committer date, so the date a page
      # edit implies does not exist until the edit is committed. The commit that
      # rewrites lab.html can never carry the matching sitemap entry, which turned
      # d1901f9 red and forced the follow-up df33088 before it. Report the pending
      # bump instead of failing; the next local prerender run picks it up.
      - name: Report pending sitemap lastmod updates
        if: always()
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is current."
          else
            echo "::notice::sitemap.xml has pending lastmod updates; they land on the next commit that runs prerender_pages.py."
            git diff -- sitemap.xml
          fi

      - name: Run static site checks
        env:
          CHECK_PUBLIC_URLS: "1"
          PUBLIC_URLS: "https://yzhao062.github.io/"
          PUBLIC_URLS_SOFT: "https://viterbi-web.usc.edu/~yzhao010/"
        run: python scripts/ci_check_site.py

      - name: Install post_to_x dependencies
        run: pip install -r scripts/requirements-post.txt

      - name: Run post_to_x contract checks
        run: python scripts/check_post_to_x_contract.py

      - name: Run post_to_linkedin contract checks
        run: python scripts/check_post_to_linkedin_contract.py
